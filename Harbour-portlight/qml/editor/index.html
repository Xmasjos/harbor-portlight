<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown editor</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
        }

        .editor {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #note-title {
            box-sizing: border-box;
            width: 100%;
            flex: 0 0 auto;
            padding: 12px 16px 8px 16px;
            border: 0;
            border-bottom: 1px solid #333;
            border-radius: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font: 20px/1.3 sans-serif;
        }

        #note {
            box-sizing: border-box;
            display: block;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            border: 0;
            border-radius: 0;
            outline: 0;
            background: transparent;
            color: #fff;
        }

        #note .cm-editor {
            height: 100%;
        }

        #note .cm-content {
            white-space: pre-wrap;
        }

        #note-status {
            box-sizing: border-box;
            flex: 0 0 auto;
            min-height: 32px;
            padding: 6px 16px;
            color: #aaa;
            font: 14px/1.4 sans-serif;
        }


    </style>
</head>
<body>
    <div class="editor">
        <input id="note-title" type="text" aria-label="Note filename" placeholder="Untitled.md" spellcheck="false">
        <div id="note" role="textbox" aria-label="Markdown note" aria-multiline="true"></div>
        <div id="note-status" role="status" aria-live="polite"></div>
    </div>
    <script src="./assets/codemirror.bundle.js"></script>
    <script>
        (function() {
            var title = document.getElementById("note-title");
            var status = document.getElementById("note-status");

            window.setNoteTitle = function(value) {
                if (title.value !== value) title.value = value;
            };

            window.setNoteStatus = function(value) {
                if (status.textContent !== value) status.textContent = value;
            };
        })();
    </script>
</body>
</html>
