<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown editor</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
        }

        textarea {
            box-sizing: border-box;
            display: block;
            width: 100%;
            height: 100%;
            padding: 16px;
            border: 0;
            border-radius: 0;
            outline: 0;
            resize: none;
            background: transparent;
            color: #fff;
            font: 18px/1.4 sans-serif;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <textarea id="note" aria-label="Markdown note" spellcheck="true"></textarea>
    <script>
        (function() {
            var editor = document.getElementById("note");

            window.setNoteText = function(text) {
                if (editor.value !== text) editor.value = text;
            };
        })();
    </script>
</body>
</html>
